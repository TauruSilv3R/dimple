<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120202"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Crimson Primary Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="50%" stop-color="#BC0202"/>
      <stop offset="100%" stop-color="#830000"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#830000"/>
      <stop offset="60%" stop-color="#BC0202"/>
      <stop offset="100%" stop-color="#FF2A2A"/>
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Outer Shell -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#830000" stroke-width="8"/>
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#FF0000" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Iconic 'D' + Download Stream Glyph -->
  <g filter="url(#crimsonGlow)">
    <!-- Outer 'D' Loop -->
    <path d="M 148 116 
             H 268 
             C 356 116, 404 176, 404 256 
             C 404 336, 356 396, 268 396 
             H 148 
             Z" 
          fill="none" 
          stroke="url(#crimsonGrad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Integrated Downward Arrow Stem & Dimple Core -->
    <path d="M 236 188 
             V 286 
             M 194 250 
             L 236 292 
             L 278 250" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Signature Red Dimple Dot -->
    <circle cx="236" cy="342" r="14" fill="#FF0000"/>
  </g>
</svg>
