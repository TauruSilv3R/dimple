<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="glowTop" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#ff5500" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b0d10" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottom" cx="80%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0b0d10" stop-opacity="0" />
    </radialGradient>
    
    <!-- Text Orange Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffa64d" />
      <stop offset="100%" stop-color="#ff6400" />
    </linearGradient>

    <!-- Accent Fire Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8c00" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#ff2200" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c22" />
      <stop offset="100%" stop-color="#101216" />
    </linearGradient>

    <filter id="shadowBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes sweepGlow {
      0% { stop-color: #ff8c00; }
      50% { stop-color: #ff3300; }
      100% { stop-color: #ff8c00; }
    }
    .floating-logo {
      animation: floatIcon 4s ease-in-out infinite;
      transform-origin: center;
    }
    .pulse-ring {
      animation: pulseGlow 3s ease-in-out infinite;
      transform-origin: center;
    }
    .title-font {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -1.5px;
    }
    .mono-font {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="360" rx="20" fill="#0c0e12" />
  
  <!-- Ambient Radiance Backgrounds -->
  <rect width="1200" height="360" rx="20" fill="url(#glowTop)" />
  <rect width="1200" height="360" rx="20" fill="url(#glowBottom)" />

  <!-- Subtle Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#252b36" stroke-width="1.5" stroke-opacity="0.8" />
  
  <!-- Left Side: Interactive 3D Emblem Container -->
  <g class="floating-logo" transform="translate(80, 80)">
    <!-- Glow Ring Behind Icon -->
    <circle cx="95" cy="95" r="85" fill="#ff6400" opacity="0.15" class="pulse-ring" filter="url(#orangeGlow)" />
    
    <!-- Outer Octagon/Beveled Badge -->
    <rect x="15" y="15" width="160" height="160" rx="36" fill="url(#cardGrad)" stroke="#2f3642" stroke-width="2" filter="url(#shadowBlur)" />
    <rect x="25" y="25" width="140" height="140" rx="28" fill="none" stroke="#ff6400" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Modern Play / Dimple Chevron Shape -->
    <path d="M78 62 L132 95 L78 128 Z" fill="url(#fireGrad)" filter="url(#orangeGlow)" />
    <circle cx="124" cy="74" r="6" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Center-Right: Branding & Typographic Hierarchy -->
  <g transform="translate(320, 75)">
    <!-- Status / Platform Pill -->
    <g transform="translate(0, 0)">
      <rect width="215" height="28" rx="14" fill="#1b1e26" stroke="#2b313d" stroke-width="1" />
      <circle cx="14" cy="14" r="4.5" fill="#22c55e" />
      <text x="26" y="18" fill="#adb5bd" font-size="11" font-weight="700" class="mono-font" letter-spacing="0.5">V2.4 • DESKTOP EDITION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="82" fill="url(#textGrad)" font-size="64" class="title-font">DIMPLE</text>
    <text x="245" y="60" fill="#ff6400" font-size="16" font-weight="900" class="title-font">PRO</text>

    <!-- Tagline -->
    <text x="2" y="118" fill="#9ca3af" font-size="17" font-weight="500" class="title-font" letter-spacing="0.2">
      High-Performance Media Downloader &amp; Dedicated Theater Workstation
    </text>

    <!-- Feature Spec Badges Grid -->
    <g transform="translate(2, 148)">
      <!-- Badge 1: 4K 60FPS -->
      <g transform="translate(0, 0)">
        <rect width="120" height="32" rx="8" fill="#14171d" stroke="#262c37" stroke-width="1" />
        <text x="60" y="20" fill="#f8f9fa" font-size="11" font-weight="700" class="mono-font" text-anchor="middle">⚡ 4K • 60 FPS</text>
      </g>

      <!-- Badge 2: Picture-in-Picture -->
      <g transform="translate(130, 0)">
        <rect width="170" height="32" rx="8" fill="#14171d" stroke="#262c37" stroke-width="1" />
        <text x="85" y="20" fill="#f8f9fa" font-size="11" font-weight="700" class="mono-font" text-anchor="middle">📺 PICTURE-IN-PICTURE</text>
      </g>

      <!-- Badge 3: Multi-Threaded Engine -->
      <g transform="translate(310, 0)">
        <rect width="180" height="32" rx="8" fill="#14171d" stroke="#262c37" stroke-width="1" />
        <text x="90" y="20" fill="#f8f9fa" font-size="11" font-weight="700" class="mono-font" text-anchor="middle">🚀 CONCURRENT QUEUE</text>
      </g>

      <!-- Badge 4: 1,700+ Sites -->
      <g transform="translate(500, 0)">
        <rect width="145" height="32" rx="8" fill="#14171d" stroke="#262c37" stroke-width="1" />
        <text x="72" y="20" fill="#f8f9fa" font-size="11" font-weight="700" class="mono-font" text-anchor="middle">🌐 1,700+ PLATFORMS</text>
      </g>

      <!-- Badge 5: YouTube Shortcuts -->
      <g transform="translate(655, 0)">
        <rect width="150" height="32" rx="8" fill="#14171d" stroke="#ff6400" stroke-width="1" stroke-opacity="0.6" />
        <text x="75" y="20" fill="#ff7a00" font-size="11" font-weight="800" class="mono-font" text-anchor="middle">⌨️ PRO SHORTCUTS</text>
      </g>
    </g>
  </g>
</svg>

